[project]
name = "recall"
version = "0.36.5"
description = "Session recall and analytics for AI agent sessions"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.5",
  # Bounded raw writes and ID binding require Arrow even without MLX.
  # PyArrow 25 / DuckDB 1.5.4 replacement scans reproduced Linux exit 139;
  # the PyArrow 24 control passed. Retain the cap until native integration
  # passes the populated upgrade benchmark and Linux ingestion checks.
  "pyarrow>=14.0,<25",
  "pydantic>=2.6",
  "typer>=0.27.2",
  "click>=8.0",  # we import click.core.ParameterSource directly in cli/contract.py; typer 0.26 dropped its hard click dep
  "toon-format>=0.9.0b1",
  # Filesystem watcher (required for active-session watch mode per REQ-DAEMON-040)
  "watchdog>=4.0",
  # Embedding support (ONNX — cross-platform CPU baseline)
  "onnxruntime>=1.30.0",
  "huggingface-hub>=0.20",
  "tokenizers>=0.20",
]

[project.optional-dependencies]
# GPU-accelerated embeddings for Apple Silicon (Metal)
mlx = [
  "mlx>=0.20.0",
  "mlx-lm>=0.31.3",
  # transformers is a transitive dep of mlx-lm, but mlx-lm only requires
  # `transformers>=5.0.0` (no upper bound). transformers 5.13.0 tightened
  # AutoTokenizer.register() to inspect `key.__module__`, which crashes at
  # `import mlx_lm` (tokenizer_utils.py registers "NewlineTokenizer" by string):
  # `AttributeError: 'str' object has no attribute '__module__'`. That import-time
  # failure takes the whole llm-local daemon down at watch-mode startup and, because
  # the socket is already bound, wedges every RPC call. Verified with mlx-lm 0.31.2
  # and 0.31.3: 5.13.0 breaks; 5.12.1 and 5.14.0 through 5.17.0 import cleanly.
  # The upper bound admits new transformers minors only through a reviewed bump.
  "transformers>=5.0.0,!=5.13.*,<5.18",
]
anthropic = [
  "anthropic>=1.8.0",
]
# Empty alias retained for backward compatibility per REQ-DAEMON-040.
# watchdog is now a required runtime dependency; `recall[watch]` resolves to no extras.
watch = []
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.8",
]

[project.scripts]
recall = "recall.cli.app:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"recall.db" = ["*.sql"]
