name: release-please

# Automated releases. On every push to main, release-please reads the
# Conventional Commits since the last release tag and maintains a "release PR"
# for the one root Recall release surface: packages/recall/pyproject.toml, both
# plugin manifests, scripts/install.sh (RECALL_PINNED_REF), and CHANGELOG.md.
# The root package intentionally includes release-worthy skill/plugin changes.
# Merging that PR creates the vX.Y.Z tag and GitHub release. No release fires
# until a feat/fix commit lands; chore/docs-only ranges produce no release PR.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A fine-grained PAT (0xsend/recall only; contents + pull-requests
          # write), not GITHUB_TOKEN: events GITHUB_TOKEN creates do not trigger
          # other workflows, so ci.yml would never run on the release PR and the
          # required `check` status would block its merge. The token expires;
          # when it does this step fails with bad credentials until
          # RELEASE_PLEASE_TOKEN is regenerated.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Defaults, stated explicitly for discoverability.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # uv.lock records the workspace member's OWN version, so a release bump to
      # packages/recall/pyproject.toml desynchronizes it. release-please cannot
      # maintain it through extra-files (the version sits inside an array of
      # package tables, not at a fixed jsonpath), so it must be regenerated.
      #
      # Left alone the two drift at every release, and because ci.yml runs
      # `uv sync --locked` -- which fails closed on exactly that mismatch --
      # main goes red for the NEXT contributor PR, at "Install dependencies",
      # before a single check runs. That is a failure with no relationship to
      # the PR that hits it.
      #
      # This runs only when a release PR exists, and pushes only when the lock
      # actually moved, so a no-op release cycle adds no commit.
      # release-please-action does not check out the repo, so the lock sync
      # brings its own checkout of the release branch plus uv.
      - name: Check out the release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Credentials stay persisted: the lock-sync step below pushes with the
        # checkout's token. It must be the PAT: a GITHUB_TOKEN push becomes the
        # release PR's head without triggering ci.yml, so `check` never reports
        # on that head and the merge stays blocked.
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        if: ${{ steps.release.outputs.pr }}
        run: uv python install 3.12

      # The `|| '{}'` fallback is load-bearing. A step's `env:` is evaluated
      # EAGERLY, before `if:` can skip the step, so on any run where
      # release-please produces no release PR -- a release-cut run, or a
      # ci/chore-only push -- `outputs.pr` is the empty string and a bare
      # `fromJSON('')` fails the whole job with "Error reading JToken from
      # JsonReader". That reds every release commit for a step that had nothing
      # to do. `with:` above is evaluated lazily and needs no such guard; keep
      # the branch name in `env` rather than interpolating it into `run:`, which
      # would reintroduce script injection.
      - name: Sync uv.lock on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the release version; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with the release version"
          git push origin "HEAD:$RELEASE_BRANCH"
